
name: Compilar MonsterGuard

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
- name: Baixar codigo
uses: actions/checkout@v4

- name: Instalar Java 25
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '25'

- name: Compilar MonsterGuard
run: |
chmod +x gradlew
./gradlew build

- name: Disponibilizar JAR
uses: actions/upload-artifact@v4
with:
name: MonsterGuard-Modificado
path: build/libs/*.jar
